<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 한줄평</title>
<style>
  :root {
    --bg: #fdf6ec;
    --card: #ffffff;
    --accent: #ff9f68;
    --accent-dark: #e8814a;
    --text: #3a3a3a;
    --sub: #999;
    --border: #f0e4d4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .wrap {
    width: 100%;
    max-width: 520px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 26px;
    margin: 0 0 6px;
  }

  header p {
    margin: 0;
    color: var(--sub);
    font-size: 14px;
  }

  form {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    margin-bottom: 32px;
  }

  form input, form textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 12px;
    resize: none;
  }

  form textarea {
    min-height: 70px;
  }

  form input:focus, form textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  form button {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  form button:hover { background: var(--accent-dark); }
  form button:disabled { background: #ddd; cursor: not-allowed; }

  #status {
    font-size: 13px;
    margin-top: 8px;
    min-height: 16px;
  }

  #status.error { color: #d1453b; }
  #status.ok { color: #4a9d5f; }

  .list { display: flex; flex-direction: column; gap: 12px; }

  .entry {
    background: var(--card);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  .entry .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .entry .name {
    font-weight: 700;
    font-size: 14px;
    color: var(--accent-dark);
  }

  .entry .time {
    font-size: 12px;
    color: var(--sub);
  }

  .entry .content {
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .empty {
    text-align: center;
    color: var(--sub);
    font-size: 14px;
    padding: 40px 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📔 오늘의 한줄평</h1>
      <p>친구들의 오늘 하루, 한 줄로 남겨보세요</p>
    </header>

    <form id="entry-form">
      <input type="text" id="student_name" placeholder="닉네임" maxlength="20" required />
      <textarea id="content" placeholder="오늘 하루 한줄평을 남겨주세요" maxlength="200" required></textarea>
      <button type="submit" id="submit-btn">작성하기</button>
      <div id="status"></div>
    </form>

    <div class="list" id="list">
      <div class="empty">불러오는 중...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ============================================
    // 여기에 본인의 Supabase 프로젝트 정보를 입력하세요
    // Supabase 대시보드 -> Settings -> API 에서 확인 가능
    // ============================================
    const SUPABASE_URL = "https://mftbbemfavowclaqrpoh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mdGJiZW1mYXZvd2NsYXFycG9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTExODIsImV4cCI6MjEwMjY4NzE4Mn0.0h77kygkMRbLxxw8TgnHAZ1a7UTDdz3tcerOFybN4l4";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("entry-form");
    const nameInput = document.getElementById("student_name");
    const contentInput = document.getElementById("content");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");
    const listEl = document.getElementById("list");

    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString("ko-KR", {
        month: "long", day: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function renderEntries(entries) {
      if (!entries || entries.length === 0) {
        listEl.innerHTML = '<div class="empty">아직 작성된 한줄평이 없어요.</div>';
        return;
      }
      listEl.innerHTML = entries.map(e => `
        <div class="entry">
          <div class="top">
            <span class="name">${escapeHtml(e.student_name)}</span>
            <span class="time">${formatTime(e.created_at)}</span>
          </div>
          <div class="content">${escapeHtml(e.content)}</div>
        </div>
      `).join("");
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadEntries() {
      const { data, error } = await client
        .from("counsels")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        listEl.innerHTML = '<div class="empty">불러오기에 실패했습니다.</div>';
        console.error(error);
        return;
      }
      renderEntries(data);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const student_name = nameInput.value.trim();
      const content = contentInput.value.trim();

      if (!student_name || !content) {
        statusEl.textContent = "닉네임과 한줄평을 모두 입력해주세요.";
        statusEl.className = "error";
        return;
      }

      submitBtn.disabled = true;
      statusEl.textContent = "";
      statusEl.className = "";

      const { error } = await client
        .from("counsels")
        .insert([{ student_name, content }]);

      submitBtn.disabled = false;

      if (error) {
        statusEl.textContent = "작성에 실패했습니다. 잠시 후 다시 시도해주세요.";
        statusEl.className = "error";
        console.error(error);
        return;
      }

      statusEl.textContent = "작성되었습니다!";
      statusEl.className = "ok";
      contentInput.value = "";
      loadEntries();
    });

    loadEntries();
  </script>
</body>
</html>
