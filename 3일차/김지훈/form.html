        </tr>

    <br>

        <tr>

        <tr>

        <tr>

          <td><input type="text" maxlength="11"></td>

    </table>

      <tr>
        <th rowspan="3">병<br>역</th>
        <th>군필</th>
        <td colspan="2"><input type="text" maxlength="11"></td>
        <th>면제사유</th>
        <td colspan="2"><input type="text" maxlength="11"></td>
        <th>보훈 대상 여부</th>
      </tr>

                <option selected value="0">병장</option>
                <option value="1">상병</option>
