<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="=UTF-8">
        <title> navigation </title>
        <style>
            nav ul{
                list-style-type: none; /*불릿제거*/
            }
            nav ul li{
                display: inline-block;      /*한줄로 정렬*/
                padding: 10px 20px;         /*패딩의 여백 위,아래10 좌우20*/
                margin: 10px;               /*패딩 밖 여백10*/
                border: 1px solid black;  /*테두리 실선으로된 검은색*/
            }
            a:link, a:visited{          /*방문o방문x 구분*/
                color: black;         /*방문o방문x색상설정*/
                text-decoration: none;  /*링크 밑줄제거*/
            }
        </style>

    </head>
    <body>
        <nav>
            <ul>
                <li><a href="#">메뉴1</a></li>
                <li><a href="#">메뉴2</a></li>
                <li><a href="#">메뉴3</a></li>
                <li><a href="#">메뉴4</a></li>
            </ul>
        </nav>
    </body>
</html>
