<!DOCTYPE html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <title>변수 선언 및 출력</title>
    <script type="text/javascript">
        var num = 0;
        for(var i = 1; i <= 10 ; i ++){
            if(i == 9){
                break;          
            }
        num++;
        }
        document.write(num); //4
    
    </script>
    </head>
</head>


// continue는 break와 반대개념
