<!DOCTYPE html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <title>변수 선언 및 출력</title>
     <script type="text/javascript">
     var i = 24;
        if (i > 25) {
            document.write("Greater than 25.");
        }
        else if (i > 12) {
            document.write("12에서 25 사이");
        }
        else if (i < 0) {
            document.write("Less than 0.");
        }
        else {
            document.write("Between 0 and 25, inclusive.");
        }
    </script>
    </head>
</head>
