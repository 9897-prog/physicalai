<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">   
<title>우리 동네 고양이 도감</title>    
<style>
body{
    background-color:#eef2ec;       
    font-family: Arial, sans-serif;   
    margin:0;
    padding:0;
}
/* ===== 상단 바 : 로고와 메뉴가 한 줄에 ===== */
header{
    background-color:#2f6f4e;       
    color:white;                    
    padding:15px;                    
    display:flex;                     
    justify-content:center;           
    align-items:center;               
}
header h1{
    color:white;                    
    margin:0;
    padding:0 30px;                   
}
nav ul{
    list-style-type:none;            
    margin:0;
    padding:0;
}
nav ul li{
    display:inline;                 
    margin:0 12px;                  
}
nav ul li a{
    color:white;
    text-decoration:none;           
}
nav ul li a:hover{
    color:#ffd66b;
}
/* ===== 소개 영역 : 글은 왼쪽, 사진은 오른쪽 ===== */
.hero{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px;                       
    background-color:white;
}
.hero-text{
    width:340px;                        
    padding:20px;                       
}
.hero-text h2{
    color:#2f6f4e;
    margin:0;
    padding:0;
}
.hero-text p{
    color:#666;
}
.hero-img{
    width:200px;                           
    height:200px;                          
    border-radius:50%;                        
    box-shadow:0 5px 15px rgba(0,0,0,0.2);  
}
/* ===== 카드 3개가 가로로 나란히 ===== */
.cards{
    display:flex;
    justify-content:center;
    padding:40px;
}
.card{
    width:220px;                              
    background-color:white;
    border-radius:12px;
    padding:20px;                              
    margin:0 15px;                             
    text-align:center;                         
    box-shadow:0 3px 8px rgba(0,0,0,0.1);
}
.card img{
    width:100px;
    height:100px;
    border-radius:50%;
}
.card h2{
    color:#2f6f4e;
    margin:15px 0 5px;
}
.card p{
    color:#777;
}
.btn{
    display:inline-block;
    padding:8px 18px;
    background-color:#2f6f4e;
    color:white;
    text-decoration:none;
    border-radius:20px;
}
.btn:hover{
    background-color:#1d4a33;
}
footer{
    text-align:center;
    padding:20px;
    background-color:#2f6f4e;
    color:white;
}
/* ===== 화면이 좁아지면 가로 배치를 세로로 ===== */
@media screen and (max-width:600px){                         
    header{
        display:block;
        text-align:center;
    }
    header h1{
        padding:0;
    }
    nav ul li{
        display:inline-block;
        margin:10px 8px;
    }
    .hero{
        display:block;
        text-align:center;
        padding:30px;
    }
    .hero-text{
        width:260px;
    }
    .cards{
        display:block;
        padding:20px;
    }
    .card{
        width:220px;
        margin:15px;
    }
}
</style>
</head>
<body>
<header>
    <h1>고양이 도감</h1>                                
    <nav>                                               
        <ul>                                            
            <li><a href="#">소개</a></li>               
            <li><a href="#">고양이들</a></li>
            <li><a href="#">제보하기</a></li>
        </ul>
    </nav>
</header>
<div class="hero">                                                                                             
    <div class="hero-text">                                                                                     
        <h2>우리 동네 고양이들</h2>                                                                               
        <p>골목에서 만난 고양이들을 기록하는 페이지입니다. 이름과 성격, 자주 나타나는 자리를 함께 적어 두었습니다.</p>  
        <a href="#" class="btn">제보하기</a>                                                                    
    </div>
    <img src="image.jpg" class="hero-img">                                                                      
</div>
<div class="cards">
    <div class="card">
        <img src="image1.jpg">
        <h2>치즈</h2>                                                                     
        <p>편의점 앞 담장에 자주 앉아 있습니다. 사람을 별로 무서워하지 않습니다.</p>
    </div>
    <div class="card">
        <img src="image2.jpg">
        <h2>까망</h2>
        <p>주차장 3번 자리 아래가 지정석입니다. 낮에는 거의 자고 있습니다.</p>
    </div>
    <div class="card">
        <img src="image3.jpg">
        <h2>삼색</h2>
        <p>놀이터 미끄럼틀 근처에 나타납니다. 셋 중 가장 겁이 많습니다.</p>
    </div>
</div>
<footer>                                                    
    <p>&copy; 2026 고양이 도감</p>                          
</footer>
</body>
</html>
