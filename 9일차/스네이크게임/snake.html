<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>스네이크 게임</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #1e1e2e;
    font-family: "Malgun Gothic", sans-serif;
    color: #eee;
  }
  h1 {
    margin: 20px 0 10px;
  }
  #score {
    font-size: 20px;
    margin-bottom: 10px;
  }
  #gameCanvas {
    background: #111;
    border: 3px solid #444;
    border-radius: 6px;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #overlay h2 {
    font-size: 36px;
    color: #ff5555;
    margin-bottom: 10px;
  }
  #overlay p {
    font-size: 20px;
    margin: 5px 0 20px;
  }
  #restartBtn {
    padding: 10px 24px;
    font-size: 16px;
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  #restartBtn:hover {
    background: #45a049;
  }
  #hint {
    margin-top: 10px;
    font-size: 14px;
    color: #999;
  }
</style>
</head>
<body>
  <h1>🐍 스네이크 게임</h1>
  <div id="score">점수: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="hint">방향키(↑ ↓ ← →)로 이동하세요</div>

  <div id="overlay">
    <h2>게임 오버</h2>
    <p id="finalScore">최종 점수: 0</p>
    <button id="restartBtn">다시 시작</button>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const finalScoreEl = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake, direction, nextDirection, food, score, gameOver, gameLoopId;

function init() {
  snake = [{ x: 10, y: 10 }];
  direction = { x: 0, y: 0 };
  nextDirection = { x: 0, y: 0 };
  score = 0;
  gameOver = false;
  placeFood();
  scoreEl.textContent = '점수: 0';
  overlay.style.display = 'none';
  if (gameLoopId) clearInterval(gameLoopId);
  gameLoopId = setInterval(tick, 120);
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
  } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
}

function tick() {
  if (gameOver) return;

  direction = nextDirection;

  if (direction.x === 0 && direction.y === 0) {
    draw();
    return;
  }

  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  if (
    head.x < 0 || head.x >= tileCount ||
    head.y < 0 || head.y >= tileCount ||
    snake.some(seg => seg.x === head.x && seg.y === head.y)
  ) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = '점수: ' + score;
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ff5555';
  ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#4caf50' : '#8bc34a';
    ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize - 2, gridSize - 2);
  });
}

function endGame() {
  gameOver = true;
  clearInterval(gameLoopId);
  finalScoreEl.textContent = '최종 점수: ' + score;
  overlay.style.display = 'flex';
}

document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp':
      if (direction.y === 0) nextDirection = { x: 0, y: -1 };
      e.preventDefault();
      break;
    case 'ArrowDown':
      if (direction.y === 0) nextDirection = { x: 0, y: 1 };
      e.preventDefault();
      break;
    case 'ArrowLeft':
      if (direction.x === 0) nextDirection = { x: -1, y: 0 };
      e.preventDefault();
      break;
    case 'ArrowRight':
      if (direction.x === 0) nextDirection = { x: 1, y: 0 };
      e.preventDefault();
      break;
  }
});

restartBtn.addEventListener('click', init);

init();
</script>
</body>
</html>
